[build-system]
requires = ["setuptools~=81.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "press"
dynamic = ["version"]
description = "Managed Frappe Hosting"
authors = [
    {name = "Frappe", email = "aditya@erpnext.com"}
]
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.14,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ansible-core==2.20.10",
    "beautifulsoup4",
    "boto3==1.39.14",
    "Click",
    "coverage",
    "dnspython==2.9.0",
    "docker==7.1.0",
    "dockerfile==3.2.0",
    "oci==2.180.0",
    "paramiko==3.3.1",
    "pexpect==4.9.0",
    "posthog==5.0.0",
    "prometheus-client==0.19.0",
    "PyGithub==1.44.1",
    "pyOpenSSL~=26.0.0",
    "python-telegram-bot==22.5",
    "razorpay>=1.3.0",
    "requests~=2.33.0",
    "responses==0.23.1",
    "selenium==4.23.1",
    "semantic-version==2.10.0",
    "sql_metadata==2.19.0",
    "stripe==2.56.0+univentures.1",
    "tldextract==3.4.4",
    "tomli==2.0.1",
    "tqdm==4.66.3",
    "twilio==8.10.3",
    "wrapt~=1.15.0",
    "elasticsearch-dsl>=8.0.0,<9.0.0",
    "hcloud==2.2.1",
    "playwright==1.64.0",
    "prometheus-api-client==0.6.0",
    "pydo==0.24.0",
]

[project.scripts]
backbone = "backbone.cli:cli"

[tool.setuptools]
packages = ["press"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "press.__version__"}

[tool.bench.frappe-dependencies]
frappe = ">=16.23.0,<17.0.0"
