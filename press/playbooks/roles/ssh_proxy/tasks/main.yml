---
- name: Create SSH Proxy Directory
  become: yes
  become_user: frappe
  file:
    dest: /home/frappe/ssh
    state: directory

- name: Login to Docker Registry
  become: yes
  become_user: frappe
  command: "docker login -u {{ registry_username }} -p {{ registry_password }} {{ registry_url }}"

- name: Copy home directory from SSH Image
  become: yes
  become_user: frappe
  command: "docker run --rm --net none --security-opt seccomp=unconfined --security-opt apparmor=unconfined -v /home/frappe/ssh/home:/homemount {{ docker_image }} cp -RL /home/. /homemount"

- name: Copy etc directory from SSH Image
  become: yes
  become_user: frappe
  command: "docker run --rm --net none --security-opt seccomp=unconfined --security-opt apparmor=unconfined -v /home/frappe/ssh/etc:/etcmount {{ docker_image }} cp -RL /etc/. /etcmount"

- name: Start SSH Proxy
  become: yes
  become_user: frappe
  command: "docker run -d --name ssh --restart always --security-opt seccomp=unconfined --security-opt apparmor=unconfined -p 2222:22 -v /home/frappe/ssh/etc:/etc -v /home/frappe/ssh/home:/home --hostname ssh {{ docker_image }}"
